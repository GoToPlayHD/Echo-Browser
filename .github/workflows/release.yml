name: Velopack Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.2.0)'
        required: true
        default: '1.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}".TrimStart('v')
            $tag = "v$ver"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart('v')
            $tag = "${{ github.ref_name }}"
          }
          Write-Host "Releasing version: $ver with tag: $tag"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Run Tests
        run: dotnet test tests/EchoBrowser.Tests -c Release

      - name: Publish App
        run: |
          dotnet publish EchoBrowser.csproj -c Release -r win-x64 --self-contained false -o ./publish /p:Version=${{ steps.get_version.outputs.version }}

      - name: Download Previous Releases (for Delta Patches)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./releases
          try {
            vpk download github --repoUrl "https://github.com/GoToPlayHD/Echo-Browser" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir ./releases
          } catch {
            Write-Host "No previous release found or download skipped: $_"
          }

      - name: Build Velopack Release Package
        shell: pwsh
        run: |
          vpk pack --packId EchoBrowser --packVersion ${{ steps.get_version.outputs.version }} --packDir ./publish --mainExe EchoBrowser.exe --outputDir ./releases --icon app.ico

      - name: Upload Velopack Assets to GitHub Release
        shell: pwsh
        run: |
          vpk upload github --repoUrl "https://github.com/GoToPlayHD/Echo-Browser" --token "${{ secrets.GITHUB_TOKEN }}" --publish --outputDir ./releases --tag ${{ steps.get_version.outputs.tag }}
