name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build EchoBrowser.csproj -c Release

      - name: Test
        run: dotnet test tests/EchoBrowser.Tests -c Release --logger "trx;LogFileName=results.trx"

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/EchoBrowser.Tests/TestResults/*.trx
